<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Techture Organization chart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="page-header">
        <div class="header-left">
            <img src="techture-logo.png" class="techture-logo" alt="Techture">
            <div class="header-title">
                <h1>Organization Chart</h1>
            </div>
        </div>

        <div class="header-right">
            <div class="search-wrapper">
                <input type="search" id="employee-search" class="search-input" placeholder="Search employee..." autocomplete="off">
                <button id="clear-search" class="clear-search" type="button" aria-label="Clear search">×</button>
                <div id="search-results" class="search-results hidden">
                    <div class="search-filters">
                        <select id="department-filter" class="filter-select" aria-label="Filter by department">
                            <option value="">All Departments</option>
                        </select>
                        <select id="location-filter" class="filter-select" aria-label="Filter by location">
                            <option value="">All Locations</option>
                        </select>
                    </div>
                    <div id="search-results-list"></div>
                </div>
            </div>

            <label for="excel-file" class="toolbar-button">Load File</label>
            <input type="file" id="excel-file" accept=".xlsx,.csv" hidden>

            <button id="layout-toggle-button" class="toolbar-button" type="button" aria-pressed="false" title="Switch chart orientation">
                <span class="layout-icon" aria-hidden="true"></span>
                <span id="layout-toggle-label">Horizontal Layout</span>
            </button>
            <button id="edit-mode-button" class="toolbar-button" type="button" aria-pressed="false" title="Drag employees onto a new manager to reassign them">
                <span class="reorder-icon" aria-hidden="true"></span>
                <span id="edit-mode-label">Reorder Mode</span>
            </button>
            <button id="add-placeholder-button" class="toolbar-button" type="button" title="Add a placeholder 'To Hire' node">+ To Hire</button>
            <button id="undo-button" class="toolbar-button" type="button" title="Undo the last local change" disabled>Undo</button>
            <button id="export-csv-button" class="toolbar-button" type="button">Export CSV</button>
            <button id="publish-button" class="toolbar-button" type="button">Publish</button>
            <button id="signout-button" class="toolbar-button" type="button" hidden>Sign Out</button>
            <button id="expand-collapse-button" class="toolbar-button" type="button">Expand All</button>
            <button id="fit-button" class="toolbar-button" type="button">Fit to Screen</button>
        </div>
    </header>

    <main id="main-content">
        <div id="chart-container"></div>

        <div id="status-panel" class="status-panel hidden">
            <button id="close-status-panel" class="close-status" aria-label="Close status panel">×</button>
            <div class="status-title">Data Status</div>
            <div id="status-content"></div>
        </div>

        <!-- Employee Detail Drawer -->
        <div id="employee-detail-panel" class="detail-panel" aria-hidden="true">
            <button id="close-detail-panel" class="close-detail" aria-label="Close panel">×</button>
            <div id="employee-detail-content"></div>
        </div>

        <!-- Admin Sign-In Overlay (shown only when Publish needs auth) -->
        <div id="signin-overlay" class="signin-overlay" aria-hidden="true">
            <form id="signin-form" class="signin-box">
                <h3>Admin Sign In</h3>
                <p class="signin-subtitle">Sign in to publish changes for everyone to see.</p>
                <input type="email" id="signin-email" placeholder="Email" autocomplete="username" required>
                <input type="password" id="signin-password" placeholder="Password" autocomplete="current-password" required>
                <div id="signin-error" class="signin-error"></div>
                <div class="signin-actions">
                    <button type="button" id="signin-cancel" class="signin-cancel">Cancel</button>
                    <button type="submit" class="signin-submit">Sign In</button>
                </div>
            </form>
        </div>

        <!-- Conflict Preview Overlay (shown on Publish if someone else changed data since you started editing) -->
        <div id="conflict-overlay" class="conflict-overlay" aria-hidden="true">
            <div class="conflict-box">
                <h3>Someone else made changes</h3>
                <p class="conflict-subtitle">Here's what's different between your version and the latest published version. Review before publishing.</p>
                <div id="conflict-content" class="conflict-content"></div>
                <div class="conflict-actions">
                    <button type="button" id="conflict-cancel" class="signin-cancel">Cancel &amp; Review</button>
                    <button type="button" id="conflict-discard" class="conflict-discard">Discard Mine &amp; Load Latest</button>
                    <button type="button" id="conflict-publish-anyway" class="signin-submit">Publish Mine Anyway</button>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-org-chart@3"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-flextree@2.1.2/build/d3-flextree.js"></script>
    <script type="module" src="firebase-sync.js"></script>
    <script src="index.js"></script>
</body>
</html>
